<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#F5F3EC" />

    <meta
      name="description"
      content="Testfassung der zentralen Mischtisch-Reservierungsplattform für Sachsen. Alle Funktionen zum Ausprobieren, mit Testleitfaden."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Firebase browser SDK -->
    <script
      defer
      src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"
    ></script>

    <script
      defer
      src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"
    ></script>

    <script
      defer
      src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"
    ></script>

    <script
      defer
      src="https://www.gstatic.com/firebasejs/12.17.0/firebase-storage-compat.js"
    ></script>

    <!-- SMTP.js browser client -->
    <script
      src="https://smtpjs.com/v3/smtp.js"
    ></script>

    <title>
      Mischtisch Sachsen — Testfassung der Reservierungsplattform
    </title>
  </head>

  <body>
    <noscript>
      <div id="noscript">
        <b>JavaScript ist deaktiviert.</b><br />

        Diese Anwendung benötigt JavaScript für die Verbindung zu Firebase.
        Bitte JavaScript aktivieren und die Seite neu laden.
      </div>
    </noscript>

    <div id="root"></div>

    <!-- Vite / React entry point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
